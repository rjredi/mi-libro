<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mi Libro" />
  <title>Mi Libro Interactivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- Librerías para renderizar PDF y efecto de pasar página -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    :root {
      --bg: #f6f4fa;
      --surface: #ffffff;
      --accent: #9b87f5;
      --accent-soft: #ede9fe;
      --text: #27233a;
      --muted: #6e6a86;
      --shadow: 0 12px 32px rgba(39, 35, 58, 0.12);
    }

    body.dark {
      --bg: #16151f;
      --surface: #211f2e;
      --accent: #b4a5f8;
      --accent-soft: #2e2a42;
      --text: #f3f1fa;
      --muted: #9e99b8;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    #upload-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 28px;
      text-align: center;
    }

    .card {
      background: var(--surface);
      padding: 36px 28px;
      border-radius: 28px;
      box-shadow: var(--shadow);
      max-width: 380px;
      width: 100%;
    }

    .icon-badge {
      width: 68px;
      height: 68px;
      border-radius: 22px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
      font-weight: 800;
    }

    p {
      margin: 0 0 24px;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(155, 135, 245, 0.35);
    }

    #file-input { display: none; }

    #loading-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px;
      text-align: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #reader-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
