<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Libro">
<title>Mi Libro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,sans-serif;background:#f5f3fa;color:#27233a}
body.dark{background:#16151f;color:#f3f1fa}
#up,#load,#read{width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center}
#up{display:flex;padding:24px;text-align:center}
.card{background:#fff;padding:32px 24px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.08);max-width:360px;width:100%}
body.dark .card,body.dark .btn-sm{background:#222030;color:#f3f1fa}
.btn{width:100%;padding:15px;border:0;border-radius:14px;background:#9b87f5;color:#fff;font-size:16px;font-weight:700;margin-top:16px}
header,footer{width:100%;height:54px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.btn-sm{padding:8px 12px;border:0;border-radius:10px;background:#fff;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.06)}
#wrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:10px;perspective:1400px}
#sheet{background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.22);border-radius:4px 12px 12px 4px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform .32s ease,opacity .22s ease;transform-origin:left center}
#sheet canvas{display:block;max-width:100%;max-height:100%}
.flip-next{transform:rotateY(-22deg) scale(.97);opacity:.65}
.flip-prev{transform:rotateY(18deg) scale(.97);opacity:.65}
</style>
</head>
<body>
<div id="up"><div class="card"><div style="font-size:40px">📖</div><h2>Tu Lector Personal</h2><p style="color:#6e6a86;font-size:14px">Carga tu PDF una vez. Quedará guardado en tu iPhone sin internet ni anuncios.</p><button class="btn" onclick="fi.click()">Elegir archivo PDF</button><input type="file" id="fi" accept="application/pdf" hidden></div></div>
<div id="load"><h3>Abriendo libro...</h3></div>
<div id="read">
<header><b id="bt" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%">Mi Libro</b><div><button class="btn-sm" onclick="toggleTheme()">🌙</button> <button class="btn-sm" onclick="fi.click()">📂</button></div></header>
<div id="wrap"><div id="sheet"><canvas id="cv"></canvas></div></div>
<footer><button class="btn-sm" onclick="go(-1)">‹ Ant</button><span id="ind" style="font-size:14px;font-weight:600">1 / 1</span><button class="btn-sm" onclick="go(1)">Sig ›</button></footer>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfDoc=null,cur=1,tot=0,bName='',busy=false,tx0=0;
const show=id=>['up','load','read'].forEach(x=>document.getElementById(x).style.display=x===id?'flex':'none');
const db=()=>new Promise((res,rej)=>{const r=indexedDB.open('BookDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
async function saveB(d){const b=await db();return new Promise(r=>{const t=b.transaction('s','readwrite');t.objectStore('s').put(d,'b');t.oncomplete=r})}
async function loadB(){const b=await db();return new Promise(r=>{const t=b.transaction('s','readonly');const q=t.objectStore('s').get('b');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function draw(n,dir){
if(!pdfDoc||busy||n<1||n>tot)return;
busy=true;cur=n;
if(dir){sheet.classList.add(dir>0?'flip-next':'flip-prev');await new Promise(r=>setTimeout(r,160))}
const p=await pdfDoc.getPage(cur),v1=p.getViewport({scale:1});
const mw=wrap.clientWidth-20,mh=wrap.clientHeight-20;
const sc=Math.min(mw/v1.width,mh/v1.height)*Math.min(devicePixelRatio||2,2);
const vp=p.getViewport({scale:sc});
cv.width=vp.width;cv.height=vp.height;
cv.style.width=Math.floor(vp.width/Math.min(devicePixelRatio||2,2))+'px';
cv.style.height=Math.floor(vp.height/Math.min(devicePixelRatio||2,2))+'px';
await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
sheet.classList.remove('flip-next','flip-prev');
ind.textContent=`${cur} / ${tot}`;
localStorage.setItem('p_'+bName,cur);
busy=false;
}
const go=d=>draw(cur+d,d);
wrap.addEventListener('touchstart',e=>tx0=e.touches[0].clientX,{passive:true});
wrap.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx0;if(Math.abs(dx)>40)go(dx<0?1:-1)});
async function openBook(buf,name){
show('load');bName=name;bt.textContent=name.replace(/\.pdf$/i,'');
pdfDoc=await pdfjsLib.getDocument({data:buf}).promise;tot=pdfDoc.numPages;
show('read');
const saved=+(localStorage.getItem('p_'+name)||1);
await draw(saved>=1&&saved<=tot?saved:1,0);
}
fi.onchange=async e=>{const f=e.target.files[0];if(!f)return;const b=await f.arrayBuffer();await saveB({b,n:f.name});openBook(b,f.name)};
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('th',document.body.classList.contains('dark')?'1':'0')}
onload=async()=>{if(localStorage.getItem('th')==='1')document.body.classList.add('dark');const s=await loadB();if(s)openBook(s.b,s.n);else show('up')};
</script>
</body>
</html>
